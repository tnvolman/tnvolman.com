<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0b0a" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="STRIKE" />
  <title>STRIKE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0b0a'/%3E%3Crect x='6' y='19' width='20' height='5' rx='1.2' fill='%23d8cfc2'/%3E%3Crect x='14' y='7' width='4' height='15' fill='%23d8cfc2'/%3E%3C/svg%3E" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" />
  <style>
    :root {
      --bg: #0c0b0a; --surface: #161310; --elevated: #1f1b17; --fg: #f3eee6;
      --muted: #9c9388; --subtle: #6e675f; --border: #2c2722; --accent: #d8cfc2;
      --accent-fg: #0c0b0a; --heat: #c17a4a; --heat-dim: #3a2a22;
      --sans: "Figtree", ui-sans-serif, system-ui, sans-serif;
      --display: "Fraunces", "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100dvh; margin: 0; background: var(--bg); color: var(--fg); }
    body { font-family: var(--sans); letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    textarea, input { font: inherit; color: inherit; }
    .wrap { position: relative; max-width: 72rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; display: flex; flex-direction: column; gap: 1.25rem; }
    @media (min-width: 640px) { .wrap { padding: 1.75rem 2rem 3rem; gap: 1.5rem; } }
    .grain { position: absolute; inset: 0; opacity: .4; pointer-events: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.95  0 0 0 0 0.93  0 0 0 0 0.88  0 0 0 0.05 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      background-size: 140px 140px; }
    .display { font-family: var(--display); font-optical-sizing: auto; }
    .kicker { font-size: .75rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--subtle); }
    h1 { font-family: var(--display); font-size: 2.25rem; font-weight: 500; margin: 0; letter-spacing: -.03em; line-height: 1; }
    @media (min-width: 640px) { h1 { font-size: 3rem; } }
    .muted { color: var(--muted); } .subtle { color: var(--subtle); }
    .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
    .icon-btn { width: 2.75rem; height: 2.75rem; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
    .icon-btn:hover { background: var(--elevated); color: var(--fg); }
    .progress { height: 4px; background: var(--elevated); border-radius: 999px; overflow: hidden; }
    .progress > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; min-width: 0; }
    .card.cold { border-color: color-mix(in srgb, var(--heat) 40%, var(--border)); }
    .grid-3 { display: grid; grid-template-columns: 1fr; gap: .75rem; }
    #strikes { display: grid; grid-template-columns: 1fr; gap: .75rem; }
    .grid-lanes { display: grid; grid-template-columns: 1fr; gap: .75rem; }
    @media (min-width: 640px) { .grid-3 { grid-template-columns: repeat(3, 1fr); } .span-3 { grid-column: 1 / -1; } #strikes { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 768px) { .grid-lanes { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1280px) { .grid-lanes { grid-template-columns: repeat(3, 1fr); } }
    .heat { display: flex; height: 2.75rem; align-items: center; gap: 4px; }
    .heat button { flex: 1; height: 2.75rem; display: flex; align-items: center; }
    .heat i { display: block; height: 10px; width: 100%; border-radius: 999px; background: var(--heat-dim); }
    .heat i.on { background: var(--heat); }
    .chip { height: 2rem; padding: 0 .7rem; border: 1px solid var(--border); border-radius: 999px; font-size: .75rem; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
    .chip:hover { color: var(--fg); }
    .key-chip { height: 2.75rem; padding: 0 .75rem; border: 1px solid var(--border); border-radius: 999px; font-size: .875rem; color: var(--muted); }
    .key-chip.kept { border-color: color-mix(in srgb, var(--accent) 50%, var(--border)); background: var(--elevated); color: var(--fg); }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .editable { outline: none; border-radius: 4px; cursor: text; }
    .editable:hover, .editable:focus { background: color-mix(in srgb, var(--fg) 5%, transparent); }
    .strike { display: flex; gap: .75rem; align-items: flex-start; }
    .num { width: 2.75rem; height: 2.75rem; flex-shrink: 0; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 8px; font-size: .875rem; font-weight: 500; }
    .num.done { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
    footer { display: flex; flex-direction: column; gap: 1.5rem; border-top: 1px solid var(--border); padding-top: 1.5rem; }
    @media (min-width: 640px) { footer { flex-direction: row; justify-content: space-between; align-items: flex-end; } }
    .solid { height: 2.75rem; padding: 0 1.25rem; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-weight: 500; display: inline-flex; align-items: center; gap: .5rem; min-width: 11rem; justify-content: center; }
    .quiet { height: 2.75rem; padding: 0 .75rem; border-radius: 8px; color: var(--muted); font-size: .75rem; letter-spacing: .18em; text-transform: uppercase; }
    .quiet:hover { color: var(--fg); background: var(--elevated); }
    .overlay { position: fixed; inset: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 80%, transparent); display: none; }
    .overlay.open { display: block; }
    .sheet { position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; max-height: 100dvh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px 12px 0 0; padding: 1.25rem; }
    @media (min-width: 640px) {
      .sheet { left: 50%; top: 50%; bottom: auto; right: auto; width: min(32rem, calc(100vw - 2rem)); transform: translate(-50%, -50%); border-radius: 12px; padding: 1.75rem; }
    }
    .sheet h2 { font-family: var(--display); font-size: 1.5rem; font-weight: 500; margin: .5rem 0 0; }
    .x { position: absolute; top: .75rem; right: .75rem; width: 2.75rem; height: 2.75rem; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
    .x:hover { background: var(--elevated); color: var(--fg); }
    .field { width: 100%; min-height: 6rem; resize: vertical; background: var(--elevated); border: 1px solid var(--border); border-radius: 8px; padding: .65rem .75rem; }
    .menu { position: absolute; top: 3rem; right: 0; z-index: 20; width: 12rem; background: var(--elevated); border: 1px solid var(--border); border-radius: 8px; padding: .25rem; }
    .menu button { width: 100%; text-align: left; padding: .7rem .75rem; border-radius: 6px; font-size: .875rem; }
    .menu button:hover { background: var(--surface); }
    .today-box { border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border)); background: var(--elevated); border-radius: 8px; padding: .75rem 1rem; }
    .lane-pick { width: 100%; display: flex; align-items: center; gap: .75rem; padding: .7rem .75rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: .4rem; min-height: 2.75rem; }
    .lane-pick.on { border-color: var(--accent); background: var(--elevated); }
    .toast { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); background: var(--elevated); color: var(--fg); border: 1px solid var(--border); padding: .6rem 1rem; border-radius: 8px; font-size: .875rem; z-index: 80; display: none; }
    #lock { position: fixed; inset: 0; z-index: 90; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.25rem 3rem; text-align: center; }
    #lock[hidden] { display: none; }
    #board[hidden] { display: none; }
    #lock h1 { margin-top: .35rem; }
    .dots { display: flex; gap: .75rem; margin: 1.5rem 0 1rem; }
    .dots span { width: 12px; height: 12px; border-radius: 999px; border: 1px solid var(--accent); background: transparent; }
    .dots span.on { background: var(--accent); }
    .dots.bad span { border-color: var(--heat); background: transparent; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; width: min(19rem, 100%); margin-top: .5rem; }
    .keypad button { height: 3.5rem; border-radius: 12px; background: var(--elevated); border: 1px solid var(--border); font-size: 1.25rem; font-weight: 500; }
    .keypad button:hover { color: var(--fg); background: var(--surface); }
    #btn-face { margin-top: 1.25rem; min-width: 14rem; }
    #lock .quiet { margin-top: .5rem; }
    @media print {
      @page { size: letter; margin: .55in; }
      html, body { background: #f6f1e8 !important; color: #1a1714 !important; }
      .no-print, .overlay { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="lock">
    <p class="kicker">Private</p>
    <h1>STRIKE</h1>
    <p class="muted" id="lock-msg">Set a 4-digit PIN</p>
    <div class="dots" id="lock-dots" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <p class="subtle" id="lock-err" hidden></p>
    <button class="solid" id="btn-face" hidden>Face ID</button>
    <div class="keypad" id="lock-pad"></div>
    <button class="quiet" id="btn-use-pin" hidden>Use PIN</button>
    <button class="quiet" id="btn-skip-face" hidden>Skip Face ID</button>
  </div>
  <div class="wrap" id="board" hidden>
    <div class="grain"></div>
    <header>
      <div class="row">
        <div>
          <h1>STRIKE</h1>
          <p class="muted" style="margin:.5rem 0 0;font-size:.875rem">One page. Five lanes. Three strikes.</p>
        </div>
        <div class="no-print" style="display:flex;gap:2px;position:relative">
          <button class="icon-btn" id="btn-copy" aria-label="Copy for Notion">⋓</button>
          <button class="icon-btn" id="btn-print" aria-label="Print">⎙</button>
          <button class="icon-btn" id="btn-more" aria-label="More" aria-expanded="false">⋯</button>
          <div class="menu" id="menu" hidden>
            <button id="btn-new">Start a new 30</button>
            <button id="btn-seed">Restore seed</button>
            <button id="btn-lock">Lock</button>
          </div>
        </div>
      </div>
      <div style="margin-top:1rem">
        <div class="row" style="font-size:.75rem;color:var(--muted);margin-bottom:.5rem">
          <span id="day-label"></span>
          <span id="window-label"></span>
        </div>
        <div class="progress"><span id="day-bar"></span></div>
      </div>
    </header>
    <section>
      <p class="kicker">The pull</p>
      <p class="display editable" id="pull" contenteditable="true" spellcheck="false" style="font-size:1.5rem;line-height:1.3;margin:.5rem 0 0;font-weight:500"></p>
    </section>
    <section>
      <div class="grid-3">
        <div class="kicker span-3 row" style="align-items:center">
          <span>Today’s 3 strikes <span class="muted" id="strike-count" style="margin-left:.75rem"></span></span>
          <button class="quiet no-print" id="btn-mind">MIND</button>
        </div>
        <div id="strikes" class="span-3"></div>
      </div>
    </section>
    <section>
      <p class="kicker" style="margin-bottom:.75rem">Five lanes · 30 days</p>
      <div class="grid-lanes" id="lanes"></div>
    </section>
    <footer>
      <ol id="laws" style="margin:0;padding:0;list-style:none"></ol>
      <div class="no-print" style="display:flex;flex-direction:column;gap:.75rem;align-items:stretch">
        <button class="solid" id="btn-fire">Weekly Fire</button>
        <p class="subtle" style="font-size:.75rem;margin:0;max-width:20rem">Friday. Eight minutes. Standing. The cold lane becomes tomorrow’s first strike.</p>
      </div>
    </footer>
  </div>
  <div class="overlay" id="overlay"></div>
  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast"></div>
  <script src="./app.js?v=3"></script>
  <script src="./lock.js?v=1"></script>
</body>
</html>
